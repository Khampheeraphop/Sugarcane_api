services:
  - type: web
    name: sugarcane-care-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-serve.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.8
      - key: INFERENCE_BACKEND
        value: onnx
      - key: REQUIRE_MODEL
        value: '1'
      - key: INFERENCE_API_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
