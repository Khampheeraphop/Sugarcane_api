[project]
name = "sugarcane-care-api"
version = "0.2.0"
description = "Experimental sugarcane leaf screening and field-survey API"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires local model or private feedback fixtures"]
